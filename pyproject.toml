[project]
name = "zak"
version = "0.1.0"
description = "ZAK-RBDO and ISORAK-RBDO: zeroth-order, adaptive-Kriging algorithms for Reliability-Based Design Optimization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alessio Faraci", email = "82022545+alefaraci@users.noreply.github.com" },
]
keywords = [
    "reliability-based design optimization",
    "RBDO",
    "adaptive Kriging",
    "Gaussian process",
    "genetic algorithm",
    "structural reliability",
    "surrogate modelling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.13"
dependencies = [
    "attrs>=25.1.0",
    "botorch>=0.14.0",
    "colour>=0.1.5",
    "evotorch>=0.5.1",
    "gpytorch>=1.14",
    "matplotlib>=3.10.0",
    "numpy>=2.0",
    "openturns>=1.24",
    "polars>=1.21.0",
    "rich>=13.9.4",
    "ruamel-yaml>=0.18.10",
    "scikit-learn>=1.6.1",
    "scipy>=1.15",
    "shapely>=2.0.6",
    "torch>=2.6.0",
]

[project.urls]
Repository = "https://github.com/alefaraci/zak-isorak-rbdo"
Issues = "https://github.com/alefaraci/zak-isorak-rbdo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zak"]

[dependency-groups]
dev = [
    "basedpyright>=1.28.2",
    "ruff>=0.9.9",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "examples"]
exclude = ["**/.venv", "**/__pycache__", "**/.*", "examples/results"]
typeCheckingMode = "recommended"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportIgnoreCommentWithoutRule = false
reportUnknownVariableType = false
reportImportCycles = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportConstantRedefinition = false
reportMissingParameterType = false
reportImplicitOverride = false
reportIncompatibleMethodOverride = false
reportImplicitStringConcatenation = false
reportUntypedFunctionDecorator = false
reportPrivateUsage = false
reportUnnecessaryComparison = false
